[project]
name = "store-parsers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic",
  "fastapi",
  "uvicorn",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "pydantic-settings>=2.15.0",
  "httpx",
  "openpyxl",
  "python-multipart>=0.0.32",
  "dns-connector",
  "citilink-connector",
  "playwright>=1.64.1",
  "bs4>=0.0.2",
]


[tool.uv.sources]
dns-connector = { path = "../ru-marketplace-mcp/packages/dns-connector", editable = true }
citilink-connector = { path = "../ru-marketplace-mcp/packages/citilink-connector", editable = true }
mcp-core = { path = "../ru-marketplace-mcp/packages/mcp-core", editable = true }
